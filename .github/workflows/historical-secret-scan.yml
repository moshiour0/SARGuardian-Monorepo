name: Historical Secret Scan

on:
  push:
    branches:
      - main
      - "migration/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: historical-secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan-full-history:
    name: Scan full Git history with pinned Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out full repository history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan all reachable commits
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: bash tools/scan_git_history_for_secrets.sh
