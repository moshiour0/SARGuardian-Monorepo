name: SARGuardian · Known Place Author-Exact Paper Reproduction dispatcher (Monorepo)

run-name: Known Place Paper Reproduction ${{ inputs.request_id }}

# Monorepo entry point for the separately pinned author-exact P05023 reproduction.
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "API-generated request ID used to match this run to the user's request"
        required: true
        type: string
      consent_marker:
        description: "Exact [run-know-place] marker is sent only after explicit author-exact consent"
        required: true
        type: string
      geometry_height_m:
        description: "Pinned exploratory geometry height in metres"
        required: true
        default: "5151"
        type: string
      control_draws:
        description: "Deterministic exploratory control draws"
        required: true
        default: "1000"
        type: string
      seed:
        description: "Deterministic exploratory seed"
        required: true
        default: "260826"
        type: string

permissions:
  contents: read

concurrency:
  group: known-place-paper-reproduction-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  private-repository-preflight:
    name: Require private repository before author-exact user data access
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require private repository before processing user data or credentials
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repository_private="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}" | \
            python3 -c 'import json,sys; print("true" if json.load(sys.stdin).get("private") is True else "false")')"
          if [[ "$repository_private" != "true" ]]; then
            echo "::error::Processing stopped before checkout or credentials: this repository is public, so GitHub Actions artifacts and logs may expose user AOIs and result data. Move the data-processing workflows to a private repository or make this repository private before enabling processing."
            exit 1
          fi
          echo "MONOREPO_PRIVATE_REPOSITORY_GATE=PASS"

  author-exact-p05023-replay:
    needs: private-repository-preflight
    name: Run exact-author Bhote Koshi P05023 replay
    uses: ./.github/workflows/know-place-author-exact-replay.yml
    with:
      backend_code_ref: "b825df798ea4cb9874aa10dd01174d2a8ef73cba"
      consent_marker: ${{ inputs.consent_marker }}
      bridge_authorized: false
      geometry_height_m: ${{ inputs.geometry_height_m }}
      control_draws: ${{ inputs.control_draws }}
      seed: ${{ inputs.seed }}
    secrets:
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
      EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
      GOOGLE_DRIVE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_CLIENT_JSON }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_PARENT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_PARENT_FOLDER_ID }}
