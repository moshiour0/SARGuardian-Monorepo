name: Snapshot Regression Tests

on:
  push:
    branches:
      - "migration/source-snapshot-import"
    paths:
      - "migration/source-snapshots/**"
      - "apps/**"
      - "engines/**"
      - "science/**"
      - "tools/verify_source_snapshots.py"
      - "tools/audit_source_reference_pins.py"
      - "tools/audit_workflow_contracts.py"
      - "tools/validate_workflow_candidates.py"
      - "migration/workflow-candidates/**"
      - ".github/workflows/snapshot-regression-tests.yml"
  pull_request:
    paths:
      - "migration/source-snapshots/**"
      - "apps/**"
      - "engines/**"
      - "science/**"
      - "tools/verify_source_snapshots.py"
      - "tools/audit_workflow_contracts.py"
      - "tools/validate_workflow_candidates.py"
      - "migration/workflow-candidates/**"
      - ".github/workflows/snapshot-regression-tests.yml"

permissions:
  contents: read

concurrency:
  group: snapshot-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-contract-audit:
    name: Inventory all source workflow security and data contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.3"
      - name: Audit source workflow definitions
        run: |
          python tools/audit_workflow_contracts.py "$RUNNER_TEMP/workflow-contract-audit.json"
          test -s "$RUNNER_TEMP/workflow-contract-audit.json"
      - name: Validate inactive RiverShift Monorepo workflow candidate
        run: python tools/validate_workflow_candidates.py

  snapshot-integrity:
    name: Exact Git blob and source-history integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Compare every imported source path and Git blob
        run: python tools/verify_source_snapshots.py

  source-pin-discovery:
    name: Discover embedded source revision pins
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Scan imported text sources for 40-character revisions
        run: python tools/audit_source_reference_pins.py

  promoted-dynamic-frontend:
    name: Promoted apps/web build, lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test

  promoted-dynamic-api:
    name: Promoted apps/api regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "20"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install API test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Test Google Maps dashboard adapter contract
        run: node tests/google_maps_dashboard_adapter.test.mjs
      - name: Run active API regression suite
        run: python -m pytest -q

  promoted-find-displacements:
    name: Promoted Find Displacements engine regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: engines/find-displacements
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            engines/find-displacements/requirements-dev.txt
            engines/find-displacements/tools/requirements-retention.txt
      - name: Install Find Displacements engine test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip install --disable-pip-version-check -r tools/requirements-retention.txt
          python -m pip install --disable-pip-version-check "scipy>=1.13,<2" matplotlib pyproj shapely pillow pyyaml
      - name: Compile Find Displacements modules
        run: python -m compileall -q tools dashboard
      - name: Run dashboard and worker-tools regression tests
        run: python -m pytest -q dashboard/tests tools/tests

  promoted-known-place:
    name: Promoted Known Place engine regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: engines/known-place
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            engines/known-place/requirements-dev.txt
            engines/known-place/tools/requirements-retention.txt
      - name: Install Known Place regression dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip install --disable-pip-version-check -r tools/requirements-retention.txt
          python -m pip install --disable-pip-version-check "scipy>=1.13,<2" matplotlib pyproj shapely pillow pyyaml
      - name: Compile Known Place implementation
        run: python -m compileall -q tools/know_place
      - name: Run Known Place analysis and two-polygon regression tests
        env:
          PYTHONPATH: tools
        run: python -m pytest -q tools/tests/test_know_place_*.py

  promoted-river-shift:
    name: Promoted RiverShift GCOV engine regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: engines/river-shift
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install pinned RiverShift geospatial environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: engines/river-shift/tools/river_shift/environment.yml
          cache-environment: true
          generate-run-shell: true
      - name: Compile RiverShift worker modules
        shell: micromamba-shell {0}
        run: |
          python --version
          python -m compileall -q tools/river_shift
          echo "PROMOTED_RIVERSHIFT_COMPILE_PASS"
      - name: Run RiverShift unit and workflow-contract tests
        shell: micromamba-shell {0}
        env:
          PYTHONPATH: ${{ github.workspace }}/engines/river-shift/tools/river_shift
        run: python -m pytest -q tools/river_shift/tests

  promoted-nisar-science:
    name: Promoted NISAR science regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: science/nisar-core
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: science/nisar-core/requirements.txt
      - name: Install pinned NISAR science dependencies
        run: python -m pip install --disable-pip-version-check --retries 5 --timeout 45 -r requirements.txt
      - name: Run NISAR science regression suite
        run: python -m pytest tests/ -q

  dynamic-frontend:
    name: Dynamic frontend build, lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: migration/source-snapshots/dynamic/Frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: migration/source-snapshots/dynamic/Frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test

  dynamic-api:
    name: Dynamic active API tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: migration/source-snapshots/dynamic/Backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "20"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: migration/source-snapshots/dynamic/Backend/requirements-test.txt
      - name: Install API test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Test Google Maps dashboard adapter contract
        run: node tests/google_maps_dashboard_adapter.test.mjs
      - name: Run active API regression suite
        run: python -m pytest -q

  backend-core:
    name: Backend worker, Find Displacements and dashboard tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: migration/source-snapshots/backend-main
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            migration/source-snapshots/backend-main/requirements-dev.txt
            migration/source-snapshots/backend-main/tools/requirements-retention.txt
      - name: Install isolated backend test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip install --disable-pip-version-check -r tools/requirements-retention.txt
          python -m pip install --disable-pip-version-check "scipy>=1.13,<2" matplotlib pyproj shapely pillow pyyaml
      - name: Compile worker and dashboard modules
        run: python -m compileall -q tools dashboard
      - name: Run backend and Find Displacements regression tests
        run: python -m pytest -q tests dashboard/tests tools/tests

  known-place:
    name: Known Place PR #85 regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: migration/source-snapshots/backend-known-place-pr85
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            migration/source-snapshots/backend-known-place-pr85/requirements-dev.txt
            migration/source-snapshots/backend-known-place-pr85/tools/requirements-retention.txt
      - name: Install Known Place regression dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip install --disable-pip-version-check -r tools/requirements-retention.txt
          python -m pip install --disable-pip-version-check "scipy>=1.13,<2" matplotlib pyproj shapely pillow pyyaml
      - name: Compile Known Place implementation
        run: python -m compileall -q tools/know_place
      - name: Run Known Place analysis and two-polygon regression tests
        env:
          PYTHONPATH: tools
        run: |
          python -m pytest -q tools/tests/test_know_place_*.py

  river-shift:
    name: RiverShift GCOV worker regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: migration/source-snapshots/backend-main
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install pinned RiverShift geospatial environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: migration/source-snapshots/backend-main/tools/river_shift/environment.yml
          cache-environment: true
          generate-run-shell: true
      - name: Compile RiverShift worker modules
        shell: micromamba-shell {0}
        run: |
          python --version
          python -m compileall -q tools/river_shift
          echo "RIVERSHIFT_COMPILE_PASS"
      - name: Run isolated RiverShift unit and workflow-contract tests
        shell: micromamba-shell {0}
        env:
          PYTHONPATH: ${{ github.workspace }}/migration/source-snapshots/backend-main/tools/river_shift
        run: python -m pytest -q tools/river_shift/tests

  nisar-science:
    name: NISAR science pinned regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: migration/source-snapshots/nisar-science
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: migration/source-snapshots/nisar-science/requirements.txt
      - name: Install exact science dependencies
        run: python -m pip install --disable-pip-version-check --retries 5 --timeout 45 -r requirements.txt
      - name: Run complete science regression suite
        run: python -m pytest tests/ -q
